:root{ --iso-stagger:34ms; --iso-return:550ms; }

.ibtn{appearance:none;width:var(--m-size-control-sm);height:var(--m-size-control-sm);display:grid;place-items:center;border-radius:var(--m-radius-pill);border:var(--m-border-thin) solid var(--m-color-outline-variant);background:none;cursor:pointer;color:var(--m-color-ink)}

.bar{display:grid;grid-template-columns:1fr 1fr;gap:var(--m-space-2);padding:var(--m-space-3) var(--m-space-4) calc(var(--m-space-3) + env(safe-area-inset-bottom,0px));border-top:var(--m-border-thin) solid var(--m-color-outline-variant-low);background:var(--m-color-surface-bright)}

.orow{display:flex;align-items:center;gap:var(--m-space-4);padding:var(--m-space-4) 0;border-bottom:var(--m-border-thin) solid var(--m-color-outline-variant-low)}

.orow>span{flex:1} .orow .ic{color:var(--m-color-ink)}
.orow:active{background:var(--m-color-primary-container-lowest)}

/* ---------- the thread stories (momentum-iso-motion art; phases outline → draw → filled with beats) ---------- */
.iso{position:absolute;inset:0} .iso svg{width:100%;height:100%;overflow:visible}
.iso path{transition:fill var(--m-duration-base) var(--m-easing-standard),stroke var(--m-duration-base) var(--m-easing-standard),opacity var(--m-duration-base) var(--m-easing-standard)}

.iso:is([data-phase="outline"],[data-phase="draw"]) [data-face="left"]{fill:var(--m-color-surface-container-high);stroke:var(--m-color-surface-container-high)}
.iso:is([data-phase="outline"],[data-phase="draw"]) [data-object] path[fill="none"]{stroke:var(--m-color-outline-variant)}
.iso:is([data-phase="outline"],[data-phase="draw"]) [data-object] path:not([data-face]):not([fill="none"]){fill:var(--m-color-surface-container-high);stroke:var(--m-color-surface-container-high)}
.iso:is([data-phase="outline"],[data-phase="draw"]) [data-layer="0"] path:not([fill="none"]){fill:var(--m-color-outline-variant);stroke:var(--m-color-outline-variant)}
.iso[data-phase="outline"] [data-shadow]{opacity:.45} .iso[data-phase="draw"] [data-shadow]{opacity:0}
@keyframes m-draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.iso[data-phase="draw"] [data-layer="0"],.iso[data-phase="draw"] [data-object]{animation:m-draw var(--m-duration-slow) var(--m-easing-standard) both;animation-delay:calc(var(--i,0) * var(--iso-stagger))}
.iso [data-act]{transition:opacity var(--m-duration-base) var(--m-easing-standard),translate var(--m-duration-base) var(--m-easing-standard)}
.iso [data-act~="slow"]{transition-duration:var(--m-duration-slow);transition-timing-function:var(--m-easing-enter)}
.iso:not([data-phase="filled"]) [data-act~="in"]{opacity:0}
.iso[data-phase="filled"] [data-act~="out"]{opacity:0}
.iso:not([data-phase="filled"]) [data-act~="move"]{translate:var(--ax,0) var(--ay,0)}
.iso[data-phase="outline"] [data-act],.iso[data-phase="outline"] path{transition-duration:var(--iso-return);transition-delay:0s}
.iso[data-phase="draw"] [data-act]{transition:none}
/* the story beats: colour and each change arrive in order (320 ms per beat, 34 ms inside a beat) */
.iso[data-phase="filled"] path{transition-delay:calc(var(--b,0) * var(--m-duration-slow))}
.iso[data-phase="filled"] [data-act]{transition-delay:calc(var(--ab,var(--b,0)) * var(--m-duration-slow) + var(--d,0) * var(--iso-stagger))}
.iso[data-phase="filled"] [data-shadow]{transition-delay:calc(var(--b,0) * var(--m-duration-slow))}
.art{position:relative;overflow:hidden;background:var(--m-color-surface-container-lowest);border:var(--m-border-thin) solid var(--m-color-outline-variant-low);border-radius:var(--m-radius-sm)}

/* ---------- Option 1 · Story drawer ---------- */

/* ---------- Option 2 · Story cards ---------- */
.o2 .tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0 var(--m-space-4);border-bottom:var(--m-border-thin) solid var(--m-color-outline-variant-low)}

.o2 .tab[aria-selected="true"]{color:var(--m-color-primary-pressed);border-bottom-color:var(--m-color-primary);background:var(--m-color-primary-container-lowest)}
.o2 .lead{margin:0;padding:var(--m-space-5) var(--m-space-4) var(--m-space-4);font:var(--m-type-body-md);color:var(--m-color-ink-medium)}
.o2 .cards{display:flex;gap:var(--m-space-3);overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--m-space-4);scroll-padding:0 var(--m-space-4);scrollbar-width:none}

.switch{display:flex;justify-content:center;gap:var(--m-space-1);margin:var(--m-space-4) auto 0;max-width:390px}

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ROOT=document.documentElement, OPT=document.body.dataset.opt;

const IC={menu:G('M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z'),close:G('m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z'),
  right:G('M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z'),left:G('M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z'),arrow:G('M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z'),expand:G('M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z')};

 ['Shipping Insurance','Protect shipments from covered loss, damage, and theft.',[['Coverage by shipment',[['Multi-Carrier Shipments','Parcel and freight across UPS, FedEx, DHL, and USPS'],['UPS Shipments','Coverage designed for packages shipped with UPS'],['Special Commodities','High-value, perishable, and specialty goods']]],['Get started',[['Select My Coverage','Answer a few questions to find the right fit'],['Get a Quote','Estimate cost for your shipping volume']]]]],
 ['Solutions','Tools that reduce risk before, during, and after delivery.',[['Products',[['CommerceShield','Order risk signals and chargeback protection'],['DeliveryDefense','Address confidence scores before you ship'],['Delivery Orchestration','Choose delivery options that lower risk'],['InsureShield® Shipping Insurance','Protection against loss, damage, and theft']]]]],
 ['Partners','Connect InsureShield to the platforms you already ship with.',[['Work with us',[['Connect with a Partner','Add coverage inside the platforms you use'],['Become a Partner','Offer InsureShield to your customers']]]]],
 ['Resources','Guides, stories, and support for shippers.',[['Learn',[['Insights','Articles on shipping risk and protection'],['Whitepapers & Guides','In-depth research and how-to guides'],['Customer Stories','How businesses recover faster']]],['Get help',[['Help & Support','Answers about coverage, billing, and claims']]]]],

  sheet.innerHTML=`<div class="track"><div class="lvl l1"><ul>${MENUS.map((m,i)=>`<li><button class="mrow" type="button" data-i="${i}">${m[0]}${IC.right}</button></li>${i===1?`<li><a class="mrow" href="#">Claims${IC.right}</a></li>`:''}`).join('')}</ul>${util}</div>
    <div class="lvl l2" inert><button class="back" type="button">${IC.left}All menus</button>${MENUS.map((m,i)=>`<section class="sec" data-i="${i}" aria-label="${m[0]}"><h2>${m[0]}</h2><p class="lead">${m[1]}</p><div class="art" aria-hidden="true"></div>${m[2].map(g=>`<div class="grp"><p class="meta">${g[0]}</p>${g[1].map(orow).join('')}</div>`).join('')}</section>`).join('')}</div></div>${bar}`;
  const tr=$('.track',sheet), l1=$('.l1',sheet), l2=$('.l2',sheet);
  $$('.mrow[data-i]',sheet).forEach(b=>b.addEventListener('click',()=>{ const i=b.dataset.i; $$('.sec',sheet).forEach(s=>s.classList.toggle('on',s.dataset.i===i));
    const iso=story($(`.sec[data-i="${i}"] .art`,sheet),MENUS[i][0]); rest(iso); tr.classList.add('deep'); l1.inert=true; l2.inert=false; l2.scrollTop=0;
    setTimeout(()=>play(iso),RM.matches?0:TM.slow); setTimeout(()=>$('.back',sheet).focus(),TM.slow); }));
  $('.back',sheet).addEventListener('click',()=>{ tr.classList.remove('deep'); l1.inert=false; l2.inert=true; });
  onOpen=()=>{ tr.classList.remove('deep'); l1.inert=false; l2.inert=true; };
}
/* ---------- Option 2 · Story cards ---------- */
if(OPT==='o2'){
  sheet.innerHTML=`<div class="tabs" role="tablist">${MENUS.map((m,i)=>`<button class="tab" role="tab" type="button" data-i="${i}" aria-selected="${i===0}">${m[0]}</button>`).join('')}</div><div class="scroll"><p class="lead"></p><div class="cards" aria-roledescription="carousel"></div><div class="pager"><b></b><span class="dots" aria-hidden="true"></span><span>Swipe to see each story</span></div>${util}</div>${bar}`;
  const cards=$('.cards',sheet); let seen=new Set(), io=null;
  function show(i){ $$('.tab',sheet).forEach(t=>t.setAttribute('aria-selected',String(t.dataset.i==i))); const m=MENUS[i], L=all(m); $('.lead',sheet).textContent=m[1];
    cards.innerHTML=L.map(([t,d],k)=>`<a class="card" href="#" data-k="${k}" aria-label="${amp(t)}, ${k+1} of ${L.length}"><div class="art" aria-hidden="true"></div><div class="tx"><span class="t">${amp(t)}</span><span class="d">${amp(d)}</span><span class="go">Explore${IC.arrow}</span></div></a>`).join('');
    $('.dots',sheet).innerHTML=L.map(()=>'<i></i>').join(''); seen=new Set(); cards.scrollLeft=0;
    $$('.card',cards).forEach((c,k)=>story($('.art',c),L[k][0]));
    if(io) io.disconnect();
    io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.intersectionRatio>=.75){ const k=+e.target.dataset.k; focusCard(k); } }); },{root:cards,threshold:[.75]});
    $$('.card',cards).forEach(c=>io.observe(c)); focusCard(0); }
  function focusCard(k){ const cs=$$('.card',cards); $('.pager b',sheet).textContent=`${k+1} of ${cs.length}`; $$('.dots i',sheet).forEach((d,j)=>d.classList.toggle('on',j===k));
    cs.forEach((c,j)=>{ const iso=$('.iso',c); if(j===k){ if(!seen.has(j)){ seen.add(j); play(iso); } else lit(iso); } else if(seen.has(j)) lit(iso); else rest(iso); }); }
  $$('.tab',sheet).forEach(t=>t.addEventListener('click',()=>{ show(+t.dataset.i); t.scrollIntoView({inline:'nearest',block:'nearest'}); }));
  onOpen=()=>show(+($('.tab[aria-selected="true"]',sheet)||{dataset:{i:0}}).dataset.i);
}
/* ---------- Option 3 · Thread list ---------- */
if(OPT==='o3'){
  sheet.innerHTML=`<div class="scroll"><div class="list">${MENUS.map((m,i)=>`<button class="acc" type="button" aria-expanded="false" aria-controls="p${i}" data-i="${i}"><span class="rail"><span class="node"></span></span><span class="lbl"><b>${m[0]}</b><span>${m[1]}</span></span>${IC.expand}</button>
    <div class="panel" id="p${i}" role="region" aria-label="${m[0]}">${all(m).map(([t,d])=>`<a class="trow" href="#"><span class="rail"><span class="node"></span></span><span class="art" aria-hidden="true"></span><span class="tx"><span class="t">${amp(t)}</span><span class="d">${amp(d)}</span></span></a>`).join('')}</div>`).join('')}</div>${util}</div>${bar}`;
  const sc=$('.scroll',sheet); let io=null;
  function toggle(i){ $$('.acc',sheet).forEach(a=>{ const on=a.dataset.i==i&&a.getAttribute('aria-expanded')!=='true'; a.setAttribute('aria-expanded',String(on)); $('#p'+a.dataset.i).classList.toggle('on',on); });
    if(io) io.disconnect(); const p=$('#p'+i); if(!p.classList.contains('on')) return;
    $$('.trow',p).forEach((r,k)=>{ r.classList.remove('lit'); rest(story($('.art',r),all(MENUS[i])[k][0])); });
    // the thread lights each option as it scrolls into view, in order; lit rows stay lit
    let next=0; const rows=$$('.trow',p);
    io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(!e.isIntersecting) return; const k=rows.indexOf(e.target); if(k<next) return;
      for(let j=next;j<=k;j++){ const r=rows[j], d=(j-next)*TM.slow; setTimeout(()=>{ r.classList.add('lit'); (j===k?play:lit)($('.iso',r)); },RM.matches?0:d); } next=k+1; }); },{root:sc,threshold:.6});
    rows.forEach(r=>io.observe(r)); }
  $$('.acc',sheet).forEach(a=>a.addEventListener('click',()=>toggle(+a.dataset.i)));
  onOpen=()=>{};
}
/* open / close */
burger.innerHTML=IC.menu;
function open(){ sheet.inert=false; sheet.classList.add('open'); burger.setAttribute('aria-expanded','true'); burger.setAttribute('aria-label','Close menu'); burger.innerHTML=IC.close; onOpen(); }
function close(){ sheet.classList.remove('open'); sheet.inert=true; burger.setAttribute('aria-expanded','false'); burger.setAttribute('aria-label','Open menu'); burger.innerHTML=IC.menu; burger.focus(); }
burger.addEventListener('click',()=>burger.getAttribute('aria-expanded')==='true'?close():open());
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheet.classList.contains('open')) close(); });
document.addEventListener('click',e=>{ const a=e.target.closest('a[href="#"]'); if(a) e.preventDefault(); });
$$('.switch a').forEach(a=>a.setAttribute('aria-current',String(a.getAttribute('href').includes(OPT.replace('o','m')))));
// review links: ?open (opens the menu), &menu=<index> (opens that menu)
const q=new URLSearchParams(location.search); if(q.has('open')){ open(); const i=q.get('menu'); if(i!=null){ const b=$(`[data-i="${i}"].mrow, .tab[data-i="${i}"], .acc[data-i="${i}"]`,sheet); b&&b.click(); } }
})();
</script>
</body>
